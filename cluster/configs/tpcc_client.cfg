[deployment]
image = haozesong/k2_base:latest
binary = ./tpcc_client

[program_args]
test_duration_s = 150
cpo = $$cpo_endpoints
memory = 30G
partition_request_timeout = 1s
cpo_request_timeout = 5s
cpo_request_backoff = 1s
data_load = false
num_warehouses = 1
num_concurrent_txns = 1
do_verification = false
txn_weights = {43,4,4,45,4}
