[deployment]
image = haozesong/k2_base:latest
binary = ./tpcc_client

[program_args]
test_duration_s = 30
cpo = $$cpo_endpoints
memory = 20G
partition_request_timeout = 1s
data_load = false
num_warehouses = 5
delivery_txn_batch_size = 10
num_concurrent_txns = 10
do_verification = false
txn_weights = {0,4,4,88,4}
